components:
  responses:
    401Unauthorized:
      content:
        application/problem+json:
          schema:
            additionalProperties: false
            properties:
              detail:
                type: string
              errors:
                items:
                  $ref: "#/components/schemas/ErrorDetail"
                type:
                  - array
                  - "null"
              request_id:
                type: string
              status:
                format: int64
                type: integer
              title:
                type: string
              type:
                type: string
            required:
              - type
              - title
              - status
            type: object
      description: Authentication required or access token invalid
      headers:
        WWW-Authenticate:
          description: Bearer scheme authentication challenge
          schema:
            type: string
    429TooManyRequests:
      content:
        application/problem+json:
          schema:
            additionalProperties: false
            properties:
              detail:
                type: string
              errors:
                items:
                  $ref: "#/components/schemas/ErrorDetail"
                type:
                  - array
                  - "null"
              request_id:
                type: string
              status:
                format: int64
                type: integer
              title:
                type: string
              type:
                type: string
            required:
              - type
              - title
              - status
            type: object
      description: Too many requests; rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
  schemas:
    CreateOrderInputBody:
      additionalProperties: false
      properties:
        amount_minor:
          description: Amount in minor currency units
          format: int64
          minimum: 1
          type: integer
        currency:
          description: 3-letter ISO currency code
          maxLength: 3
          minLength: 3
          type: string
        reference:
          description: Client reference
          maxLength: 64
          type: string
      required:
        - reference
        - amount_minor
        - currency
      type: object
    CredentialsInputBody:
      additionalProperties: false
      properties:
        email:
          description: User email address
          maxLength: 254
          type: string
        password:
          description: User password
          maxLength: 1024
          type: string
      required:
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          type: string
        message:
          type: string
        value: {}
      type: object
    ListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/OrderResponse"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    OrderResponse:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        id:
          format: int64
          type: integer
        owner_id:
          type: string
        reference:
          type: string
      required:
        - id
        - owner_id
        - reference
        - amount_minor
        - currency
        - created_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        request_id:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    RefreshInputBody:
      additionalProperties: false
      properties:
        refresh_token:
          description: Opaque refresh token
          type: string
      required:
        - refresh_token
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        access_token:
          type: string
        expires_at:
          format: date-time
          type: string
        refresh_expires_at:
          format: date-time
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
      required:
        - access_token
        - token_type
        - expires_at
        - refresh_token
        - refresh_expires_at
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        role:
          type: string
      required:
        - id
        - email
        - role
        - created_at
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: PASETO
      description: PASETO v4.local bearer access token
      scheme: bearer
      type: http
info:
  title: "{{APP_NAME}}"
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Returns 200 OK when the process is alive.
      operationId: healthCheck
      responses:
        "200":
          description: Service is alive
      summary: Liveness probe
      tags:
        - Operations
  /metrics:
    get:
      description: Scrape endpoint for Prometheus format metrics.
      operationId: prometheusMetrics
      responses:
        "200":
          content:
            text/plain: {}
          description: Prometheus metrics scrape response
      summary: Prometheus metrics
      tags:
        - Operations
  /readyz:
    get:
      description: Checks database connectivity and readiness to serve traffic.
      operationId: readinessCheck
      responses:
        "200":
          description: Service is ready to accept traffic
        "503":
          description: Service is not ready
      summary: Readiness probe
      tags:
        - Operations
  /v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Authenticate with email and password
      tags:
        - Auth
  /v1/auth/logout:
    post:
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Revoke a refresh token family
      tags:
        - Auth
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Rotate a refresh token for a new session
      tags:
        - Auth
  /v1/auth/register:
    post:
      operationId: authRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Register a new user account
      tags:
        - Auth
  /v1/me:
    get:
      operationId: usersMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearerAuth: []
      summary: Get current user profile
      tags:
        - Users
  /v1/orders:
    get:
      operationId: listOrders
      parameters:
        - description: Opaque pagination cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque pagination cursor
            type: string
        - description: Maximum items to return
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum items to return
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearerAuth: []
      summary: List orders with keyset pagination
      tags:
        - Orders
    post:
      operationId: createOrder
      parameters:
        - description: Optional idempotency key
          in: header
          name: Idempotency-Key
          schema:
            description: Optional idempotency key
            maxLength: 255
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
          description: Created
          headers:
            Location:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearerAuth: []
      summary: Create a new order
      tags:
        - Orders
  /v1/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          schema:
            description: Order ID
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearerAuth: []
      summary: Get order by ID
      tags:
        - Orders
  /v1/webhooks/{source}:
    post:
      description: Accepts signed inbound webhooks from external providers (e.g. Acme) and schedules background processing.
      operationId: ingestWebhook
      parameters:
        - description: Webhook provider source name (e.g. acme)
          in: path
          name: source
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook received and scheduled
        "400":
          description: Invalid payload or signature header missing
        "401":
          description: Invalid webhook signature
      summary: Inbound webhook ingest
      tags:
        - Webhooks
tags:
  - description: User registration, authentication sessions, and token management.
    name: Auth
  - description: User profile and account operations.
    name: Users
  - description: Order creation, retrieval, and keyset-paginated listing.
    name: Orders
  - description: Health checks, readiness probes, and telemetry metrics.
    name: Operations
  - description: Inbound webhook ingestion and processing.
    name: Webhooks
