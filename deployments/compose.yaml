services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15

  # --- Full stack (profile "app"): make stack ------------------------------------
  # One-shot schema migration (goose), then River migrations, then api and worker.
  migrate:
    profiles: [app]
    image: app-migrate:local
    build: {context: .., dockerfile: deployments/Dockerfile, target: migrate}
    command: ["-dir", "/migrations", "postgres", "postgres://app:app@postgres:5432/app?sslmode=disable", "up"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  river-migrate:
    profiles: [app]
    image: app:local
    build: &appbuild {context: .., dockerfile: deployments/Dockerfile}
    command: ["migrate", "-direction", "up"]
    entrypoint: ["/bin/worker"]
    environment: &appenv
      ENV: local
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      DIRECT_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      AUTH_TOKEN_KEY: ${AUTH_TOKEN_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      WEBHOOK_ACME_SECRET: ${WEBHOOK_ACME_SECRET:-local-only-webhook-secret}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1/32}
      DOCS_ENABLED: "true"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    profiles: [app]
    image: app:local
    build: *appbuild
    entrypoint: ["/bin/api"]
    environment: *appenv
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`${PUBLIC_HOST:-localhost}`) && !PathPrefix(`/metrics`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.services.api.loadbalancer.server.port: "8080"
    depends_on:
      river-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    profiles: [app]
    image: app:local
    build: *appbuild
    entrypoint: ["/bin/worker"]
    environment: *appenv
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      river-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # --- Edge ingress (profile "edge"): make stack-edge ---------------------------
  # Routes Cloudflare Tunnel -> Traefik -> api without exposing public host ports.
  traefik:
    profiles: [edge]
    image: traefik:v3.3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      - "--ping=true"
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-8088}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

  cloudflared:
    profiles: [edge]
    image: cloudflare/cloudflared:2025.2.1
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required for make stack-edge}
    depends_on:
      traefik: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
