name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Architecture check
        run: make arch-check
      - name: Vulnerability scan
        run: make vuln
      - name: sqlc diff is clean
        run: sqlc diff
      - name: OpenAPI drift check
        run: make openapi-check
      - name: go mod tidy produces no diff
        run: |
          go mod tidy
          test -z "$(git status --porcelain -- go.mod go.sum)"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Integration tests with coverage floor
        run: make cover

  migrate-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
      - name: Verify migrations up, down, up
        run: make migrate-verify PSQL='psql "postgres://app:app@localhost:5432/postgres?sslmode=disable"'

  scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Run 4-way scaffold matrix
        run: make scaffold-smoke

  image:
    # Builds both images, scans them, and emits an SBOM. Fails on fixable HIGH/CRITICAL.
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f deployments/Dockerfile -t app:ci .
      - name: Build migrate image
        run: docker build -f deployments/Dockerfile --target migrate -t app-migrate:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan migrate image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app-migrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: app:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render production overlay
        run: kubectl kustomize deployments/k8s/overlays/production > /dev/null
