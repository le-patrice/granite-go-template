name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Architecture check
        run: make arch-check
      - name: Vulnerability scan
        run: make vuln
      - name: sqlc diff is clean
        run: sqlc diff
      - name: go mod tidy produces no diff
        run: |
          go mod tidy
          test -z "$(git status --porcelain -- go.mod go.sum)"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Integration tests
        run: make test-integration

  migrate-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Verify migrations up, down, up
        run: make migrate-verify PSQL='psql "postgres://app:app@localhost:5432/postgres?sslmode=disable"'

  scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Run 4-way scaffold matrix
        run: make scaffold-smoke
